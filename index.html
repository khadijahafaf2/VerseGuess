<!DOCTYPE html>
<html>
    <head>
        <title>VerseGuess</title>
    <link rel="stylesheet" href="style.css">

    </head>
    <body onload="loadQuestion()">
        <h1> Guess the Lyrics</h1>
        <img src="flowerdisk.jpg" alt="flower" class="cover">
        <p id="lyric"></p>
        <input type="text" id="answer" placeholder="Type answer">
        <br><br>
        <button onclick="checkAnswer()">Submit</button>
        <button onclick="nextQuestion()">Next</button>
        <p id="result"></p>
        <script>
            let questions = [
            {
                lyric: "Then you're left in the _____",
                answer: "dust"
            },
            {
                lyric: "and you are ______",
                answer: "unforgettable"
            },
            {
                lyric:"Got two girls in the ______",
                answer: "cut"
            }
            ];
            let current = 0;
            function loadQuestion(){
                document.getElementById("lyric").innerHTML = questions[current].lyric;
            }
            function checkAnswer(){
                let userAnswer = document.getElementById("answer").value.toLowerCase().trim();
                if(userAnswer === questions[current].answer){
                    document.getElementById("result").innerHTML = "Correct! ✅";
                } else {
                    document.getElementById("result").innerHTML = "Wrong! ❌ Try again.";
                }
            }
            function nextQuestion(){
                current++;
                if(current < questions.length){
                    loadQuestion();
                    document.getElementById("answer").value = "";
                    document.getElementById("result").innerHTML = "";
                } else {
                    document.getElementById("lyric").innerHTML = "🎉 You finished!";
                    document.getElementById("answer").value = "";
                    document.getElementById("result").innerHTML = "";
                }
            }
        </script>
</body>
</html>
