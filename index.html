<!DOCTYPE html>
<html>
    <head>
        <title>VerseGuess</title>
    <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <h1> Guess the Lyrics</h1>
        <img src="pdisk.png" alt="flower" class="cover" style="position: fixed; top: 10px; left: 10px; width:200px; height:200px; z-index: 10;">
        <img src="hibiscus-removebg-preview (1).png" alt="hibiscus" class="hibiscus" style="position: fixed; top: 220px; left: 10px; width: 120px; height: 120px; z-index: 10;">
        <div id="start-screen">
            <img src="speedstart.jpg" alt="start image" class="start-img">
            <br><br>
            <button onclick="startGame()">Start Game</button>
        </div>

          <div id="quiz-screen" class="hidden" style="display: none;">
             
            <img id="hint" src="" alt="hint" class="hint-image">
            <p id="lyric"></p>
           
            <input type="text" id="answer" placeholder="Type answer">
            <br><br>
            <p id="score">Score: 0</p>

            <button onclick="checkAnswer()">Submit</button>
            <button onclick="nextQuestion()">Next</button>
            <p id="result"></p>
        </div>
        <div id="end-screen" style="display: none;">
            <h1>Thank you for playing!</h1>

            <img src="ending.jpg" class="start-img">

            <p id="final-score"></p>
            
            <button onclick="location.reload()">Play Again</button>
        </div>
        <script>
            let questions = [
            {
                lyric: "Then you're left in the dust unless I stuck by ya, you're a _____",
                answer: "sunflower",
                img: "img1.jpg"
            },
            {
                lyric: "If you wanna run away with me, I know a _____",
                answer: "galaxy",
                img: "img2.jpg"
            },
            {
                lyric:"You know you love me, I know you ____",
                answer: "care",
                img: "img3.jpg"
            },
            {
                lyric:"Party at the _____ down in copacabana",
                answer: "beach",
                img: "img4.jpg"
            },
            {
                lyric:"Now I've found another crush,lush life giving me _____",
                answer: "rush",
                img: "img5.jpg"
            },
            {
                lyric:"Secret thoughts have held in my ______ are harder to hide than I thought",
                answer: "heart",
                img: "img6.jpg"
            },
            {
                lyric:"Kaboom Kapow, rest in peace my granny, she got hit by a _____",
                answer: "bazooka",
                img: "img10.jpg"
            },
            {
                lyric:"I just wanna be part of your_____",
                answer: "symphony",
                img: "img7.jpg"
            },
            {
                lyric:"A _____ came around my room before you came",
                answer: "tornado",
                img: "img8.jpg"
            },
            {
                lyric:"She said, 'Do you love me?' I tell her, 'Only partly, I only love my bed and my _____'",
                answer: "momma",
                img: "img9.jpg"
            }
            ];
            let current = 0;
            let score = 0;
            let timerInterval;

            function loadQuestion(){
                document.getElementById("lyric").innerHTML = '"' + questions[current].lyric + '"';
                document.getElementById("hint").src = questions[current].img;
            }

            function startGame(){
                document.getElementById("start-screen").style.display = "none"; // hide speed start image   
                document.getElementById("quiz-screen").style.display = "block"; // show quiz screen
                loadQuestion();
            }

            function checkAnswer(){
                let userAnswer = document.getElementById("answer").value.toLowerCase().trim();
                if(userAnswer === questions[current].answer){
                    score++;
                    document.getElementById("score").innerHTML = "Score: " + score;
                    document.getElementById("result").innerHTML = "Ayyyy U got it!!! ✅";
                    document.getElementById("hint").src = "speedright.jpg";
                } else {
                    document.getElementById("result").innerHTML = "nahh twin try again! ❌ The correct answer is: <strong>" + questions[current].answer + "</strong>";
                    document.getElementById("hint").src = "speedwrong.jpg";
                }
                setTimeout(nextQuestion, 2000); // Auto-advance after 2 seconds
            }

            function nextQuestion(){
                clearInterval(timerInterval);
                current++;
                if(current < questions.length){
                    loadQuestion();
                    document.getElementById("answer").value = "";
                    document.getElementById("result").innerHTML = "";
                } else {
                   //hide quiz screen
                   document.getElementById("quiz-screen").style.display = "none";
                  
                   //show end screen
                   document.getElementById("end-screen").style.display = "block";
                  
                   //show final score
                   document.getElementById("final-score").innerHTML = "Final Score: " + score;
                }
            }
        </script>
</body>
</html>
