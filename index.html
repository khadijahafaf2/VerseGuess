<!DOCTYPE html>
<html>
    <head>
        <title>VerseGuess</title>
    <link rel="stylesheet" href="style.css">

    </head>
    <body onload="loadQuestion()">
        <h1> Guess the Lyrics</h1>
        <img src="pdisk.png" alt="flower" class="cover" style="position: fixed; top: 10px; left: 10px; width:200px; height:200px; z-index: 10;">
        <img src="hibiscus-removebg-preview (1).png" alt="hibiscus" class="hibiscus" style="position: fixed; top: 220px; left: 10px; width: 120px; height: 120px; z-index: 10;">
        <img id="hint" src="" alt="hint" class="hint-image">
        <p id="lyric"></p>
        <input type="text" id="answer" placeholder="Type answer">
        <br><br>
        <p id="score">Score: 0</p>
        <p id="timer">Timer: 20</p>
        <button onclick="checkAnswer()">Submit</button>
        <button onclick="nextQuestion()">Next</button>
        <p id="result"></p>
        <script>
            let questions = [
            {
                lyric: "Then you're left in the _____",
                answer: "dust",
                img: "img1.jpg"
            },
            {
                lyric: "If you wanna run away with me, I know a _____",
                answer: "galaxy",
                img: "img2.jpg"
            },
            {
                lyric:"You know you love me, I know you ____",
                answer: "care",
                img: "img3.jpg"
            },
            {
                lyric:"Party at the _____ down in copacabana",
                answer: "beach",
                img: "img4.jpg"
            },
            {
                lyric:"Now I've found another crush,lush life giving me _____",
                answer: "rush",
                img: "img5.jpg"
            },
            {
                lyric:"Secret _____ have held in my heart are harder to hide than I thought",
                answer: "thoughts",
                img: "img6.jpg"
            }
            {
                lyric:"I just wanna be part of your_____",
                answer: "symphony",
                img: "img7.jpg"
            }
            {
                lyric:"A _____ came around my room before you came",
                answer: "tornado",
                img: "img8.jpg"
            }
            {
                lyric:"She said, 'Do you love me?' I tell her, 'Only partly, I only love my bed and my _____'",
                answer: "momma",
                img: "img9.jpg"
            }
            ]
            let current = 0;
            let score = 0;
            let timeLeft = 20;
            let timerInterval;

            function loadQuestion(){
                document.getElementById("lyric").innerHTML = '"' + questions[current].lyric + '"';
                document.getElementById("hint").src = questions[current].img;
                startTimer();
            }

            function startTimer(){
                timeLeft = 20;
                document.getElementById("timer").innerHTML = "Timer: " + timeLeft;
                timerInterval = setInterval(function(){
                    timeLeft--;
                    document.getElementById("timer").innerHTML = "Timer: " + timeLeft;
                    if(timeLeft <= 0){
                        clearInterval(timerInterval);
                        nextQuestion();
                    }
                }, 1000);
            }

            function checkAnswer(){
                clearInterval(timerInterval);
                let userAnswer = document.getElementById("answer").value.toLowerCase().trim();
                if(userAnswer === questions[current].answer){
                    score++;
                    document.getElementById("score").innerHTML = "Score: " + score;
                    document.getElementById("result").innerHTML = "Correct! ✅";
                } else {
                    document.getElementById("result").innerHTML = "Wrong! ❌ The correct answer is: <strong>" + questions[current].answer + "</strong>";
                }
                setTimeout(nextQuestion, 2000); // Auto-advance after 2 seconds
            }

            function nextQuestion(){
                clearInterval(timerInterval);
                current++;
                if(current < questions.length){
                    loadQuestion();
                    document.getElementById("answer").value = "";
                    document.getElementById("result").innerHTML = "";
                } else {
                    document.getElementById("lyric").innerHTML = "🎉 You finished! Final Score: " + score;
                    document.getElementById("answer").value = "";
                    document.getElementById("result").innerHTML = "";
                    document.getElementById("timer").innerHTML = "Timer: 0";
                }
            }
        </script>
</body>
</html>
